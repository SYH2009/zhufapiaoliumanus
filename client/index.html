<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07121b" />
    <meta name="description" content="Ocean Raft Drift：全屏第一人称程序化海洋竹筏漂流体验。" />
    <title>Ocean Raft Drift</title>
    <style>
      /* 潮汐航图：场景优先、边缘航仪、非纯白信息层与潮汐铜绿焦点。 */
      :root { color-scheme: dark; --ink: #dbe9e9; --muted: #99adae; --accent: #48b7b2; --glass: rgba(4, 16, 23, 0.52); --line: rgba(181, 231, 224, 0.2); --edge: clamp(18px, 3vw, 42px); }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #07121b; }
      body { font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; color: var(--ink); letter-spacing: .025em; }
      #ocean-canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
      .vignette, .grain { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
      .vignette { background: radial-gradient(circle at 50% 44%, transparent 35%, rgba(0, 8, 14, .12) 66%, rgba(0, 7, 12, .42) 100%); }
      .grain { opacity: .08; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E"); mix-blend-mode: soft-light; }
      .chart-overlay { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
      .chart-grid { position: absolute; inset: 0; opacity: .22; background: linear-gradient(90deg, transparent 49.92%, rgba(140,217,211,.2) 50%, transparent 50.08%), repeating-linear-gradient(90deg, transparent 0, transparent calc(12.5% - 1px), rgba(140,217,211,.12) calc(12.5% - 1px), rgba(140,217,211,.12) 12.5%); mask-image: linear-gradient(to bottom, transparent 14%, black 44%, transparent 84%); }
      .horizon-reference { position: absolute; left: 7.5vw; right: 7.5vw; top: 46.8%; height: 1px; background: linear-gradient(90deg, transparent, rgba(151,232,222,.6) 18%, rgba(151,232,222,.28) 50%, rgba(151,232,222,.6) 82%, transparent); box-shadow: 0 0 14px rgba(72,183,178,.12); }
      .horizon-reference::before, .horizon-reference::after { content: ""; position: absolute; top: -3px; width: 1px; height: 7px; background: #86d6ce; }
      .horizon-reference::before { left: 25%; } .horizon-reference::after { right: 25%; }
      .bearing-scale { position: absolute; left: 18%; right: 18%; top: calc(46.8% - 10px); height: 6px; opacity: .7; background: repeating-linear-gradient(90deg, rgba(159,232,222,.52) 0 1px, transparent 1px 4.166%); mask-image: linear-gradient(90deg, transparent, black 15%, black 85%, transparent); }
      .center-bearing { position: absolute; top: calc(46.8% - 28px); left: 50%; transform: translateX(-50%); color: rgba(216,246,238,.74); font-size: 8px; letter-spacing: .17em; text-shadow: 0 1px 5px rgba(0,0,0,.6); }
      .solar-state { position: absolute; left: var(--edge); top: calc(var(--edge) + 81px); display: flex; align-items: center; gap: 7px; color: rgba(211,237,230,.8); font-size: 8px; letter-spacing: .13em; text-transform: uppercase; }
      .solar-state i { display: block; width: 6px; height: 6px; border: 1px solid #fff1c3; border-radius: 50%; background: #e4ab70; box-shadow: 0 0 9px rgba(242,175,101,.85); }
      #hud { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
      .hud-panel { background: linear-gradient(140deg, rgba(4, 17, 25, .66), rgba(4, 17, 25, .32)); border: 1px solid var(--line); box-shadow: inset 0 1px rgba(255,255,255,.035), 0 12px 42px rgba(0,0,0,.11); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
      .brand { position: absolute; top: var(--edge); left: var(--edge); display: flex; align-items: center; gap: 12px; }
      .brand-mark { width: 42px; height: 42px; padding: 7px; border: 1px solid rgba(182, 237, 225, .26); border-radius: 50%; background: rgba(2, 13, 19, .35); }
      .brand-mark path { stroke: var(--accent); stroke-width: 1.65; fill: none; stroke-linecap: round; }
      .brand-copy { display: grid; gap: 3px; text-shadow: 0 2px 10px rgba(0,0,0,.3); }
      .brand-title { font-size: 12px; font-weight: 700; letter-spacing: .17em; }
      .brand-subtitle, .eyebrow { color: var(--muted); font-size: 9px; line-height: 1; letter-spacing: .16em; text-transform: uppercase; }
      #renderer-status { position: absolute; top: calc(var(--edge) + 58px); left: var(--edge); color: rgba(213,235,232,.83); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
      .readout { position: absolute; left: var(--edge); bottom: var(--edge); width: min(310px, calc(100vw - 36px)); padding: 13px 14px 12px; }
      .readout-grid { display: grid; grid-template-columns: 1fr auto; gap: 8px 15px; margin-top: 12px; }
      .readout-grid span { color: var(--muted); font-size: 9px; text-transform: uppercase; }
      .readout-grid strong { color: #e0eee9; font-size: 10px; font-weight: 500; }
      .hint { margin: 12px 0 0; color: #aebebb; font-family: Georgia, "Source Serif 4", serif; font-size: 13px; line-height: 1.35; letter-spacing: .02em; }
      .controls { position: absolute; top: var(--edge); right: var(--edge); width: min(278px, calc(100vw - 36px)); padding: 15px 15px 12px; pointer-events: auto; }
      .controls-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; }
      .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(72,183,178,.12), 0 0 13px rgba(72,183,178,.72); }
      .control { padding: 10px 0; border-top: 1px solid rgba(181,231,224,.1); }
      .control-label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; color: #dbe9e9; font-size: 9px; letter-spacing: .11em; }
      output { color: var(--accent); font-size: 9px; white-space: nowrap; }
      input[type="range"] { appearance: none; width: 100%; height: 12px; margin: 0; background: transparent; cursor: pointer; }
      input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(90deg, var(--accent), rgba(199,235,229,.18)); }
      input[type="range"]::-moz-range-track { height: 2px; background: linear-gradient(90deg, var(--accent), rgba(199,235,229,.18)); }
      input[type="range"]::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; margin-top: -5px; border: 2px solid #e1f2ed; border-radius: 50%; background: #0b3135; box-shadow: 0 0 0 3px rgba(72,183,178,.15); }
      input[type="range"]::-moz-range-thumb { width: 9px; height: 9px; border: 2px solid #e1f2ed; border-radius: 50%; background: #0b3135; box-shadow: 0 0 0 3px rgba(72,183,178,.15); }
      .switch { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 2px; border-top: 1px solid rgba(181,231,224,.1); color: #dbe9e9; font-size: 9px; letter-spacing: .1em; }
      .switch input { appearance: none; width: 34px; height: 18px; margin: 0; border: 1px solid rgba(181,231,224,.27); border-radius: 999px; background: rgba(0,0,0,.3); cursor: pointer; position: relative; transition: .18s cubic-bezier(.23,1,.32,1); }
      .switch input::after { content: ""; position: absolute; left: 3px; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: #a8c4c0; transition: transform .18s cubic-bezier(.23,1,.32,1), background .18s; }
      .switch input:checked { border-color: var(--accent); background: rgba(72,183,178,.22); }
      .switch input:checked::after { transform: translateX(16px); background: #d9fff2; }
      .metrics { position: absolute; right: var(--edge); bottom: var(--edge); display: grid; justify-items: end; gap: 5px; color: #d6e5e3; font-size: 10px; text-align: right; text-shadow: 0 1px 8px rgba(0,0,0,.45); }
      .metrics span:last-child { color: var(--muted); font-size: 8px; letter-spacing: .12em; }
      #loading, #error-panel { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: #061018; transition: opacity .34s ease, visibility .34s ease; }
      #error-panel[hidden] { display: none; }
      #loading.is-hidden { opacity: 0; visibility: hidden; }
      .loading-card, .error-card { width: min(390px, calc(100vw - 44px)); padding: 24px; border: 1px solid rgba(159,222,211,.22); background: linear-gradient(140deg, #081c25, #061118); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
      .compass { width: 34px; height: 34px; border: 1px solid var(--accent); border-radius: 50%; margin-bottom: 20px; position: relative; animation: compass 2.8s linear infinite; }
      .compass::before, .compass::after { content: ""; position: absolute; left: 50%; top: 5px; width: 1px; height: 23px; background: var(--accent); transform: translateX(-50%); }
      .compass::after { transform: translateX(-50%) rotate(90deg); }
      @keyframes compass { to { transform: rotate(360deg); } }
      .loading-card h1, .error-card h1 { margin: 0 0 9px; font-size: 14px; font-weight: 600; letter-spacing: .14em; }
      .loading-card p, .error-card p { margin: 0; color: #9db0b1; font-family: Georgia, "Source Serif 4", serif; font-size: 15px; line-height: 1.45; }
      .loading-line { height: 2px; margin-top: 20px; overflow: hidden; background: rgba(181,231,224,.16); }
      .loading-line::after { content: ""; display: block; width: 44%; height: 100%; background: var(--accent); animation: loading 1.15s ease-in-out infinite alternate; }
      @keyframes loading { to { transform: translateX(128%); } }
      .error-card { border-color: rgba(255,167,138,.35); }
      .error-card h1 { color: #ffd2bd; }
      @media (max-width: 680px) {
        :root { --edge: 18px; }
        .controls { top: auto; bottom: 18px; max-width: none; width: calc(100vw - 36px); max-height: 248px; padding: 10px 14px; overflow-y: auto; }
        .controls-head { display: flex; margin-bottom: 5px; }
        .control { display: block; padding: 7px 0; }
        .switch { padding: 9px 0 0; }
        .readout { bottom: 274px; background: transparent; border: 0; box-shadow: none; backdrop-filter: none; padding: 0; width: 210px; }
        .readout-grid { display: none; }
        .hint { margin: 0; font-size: 12px; }
        .metrics { right: 18px; bottom: 278px; }
        #renderer-status { top: 70px; font-size: 8px; width: 180px; }
        .solar-state { top: 89px; font-size: 7px; }
        .horizon-reference { left: 8vw; right: 8vw; top: 40%; }
        .bearing-scale, .center-bearing { top: calc(40% - 10px); }
        .center-bearing { top: calc(40% - 28px); }
      }
      @media (prefers-reduced-motion: reduce) { .compass, .loading-line::after { animation: none; } }
    </style>
  </head>
  <body>
    <canvas id="ocean-canvas" aria-label="第一人称程序化海洋竹筏漂流体验"></canvas>
    <div class="vignette" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
    <div class="chart-overlay" aria-hidden="true"><div class="chart-grid"></div><div class="bearing-scale"></div><div class="horizon-reference"></div><div class="center-bearing">227° / SW</div><div class="solar-state"><i></i><span>SOLAR STATE · LOW SUN</span></div></div>
    <main id="hud" aria-label="Ocean Raft Drift 控制面板">
      <section class="brand" aria-label="Ocean Raft Drift">
        <svg class="brand-mark" viewBox="0 0 42 42" aria-hidden="true"><path d="M21 6.6c5 0 9.2 2.6 11.5 6.5M35.2 21c0 5.2-2.7 9.6-6.7 11.9M21 35.3c-5.2 0-9.6-2.7-11.9-6.7M6.7 21c0-5.2 2.7-9.6 6.8-11.9M13.2 24.4c3.2-2 5-5.2 7.8-5.2 2.5 0 4.5 2.7 7.8 1.1"/></svg>
        <div class="brand-copy"><div class="brand-title">OCEAN RAFT DRIFT</div><div class="brand-subtitle">TIDAL CHART / 01</div></div>
      </section>
      <div id="renderer-status">正在建立海图坐标…</div>

      <section class="readout hud-panel" aria-label="漂流状态">
        <div class="eyebrow">Live navigation</div>
        <div class="readout-grid"><span>航向</span><strong>227° · SW</strong><span>海流</span><strong>稳定 / 长涌</strong><span>距离陆地</span><strong>视野外</strong></div>
        <p class="hint">随浪而行，不追逐海岸。</p>
      </section>

      <section class="controls hud-panel" aria-label="海洋控制">
        <div class="controls-head"><span class="eyebrow">Deck instruments</span><span class="live-dot" aria-hidden="true"></span></div>
        <label class="control"><span class="control-label"><span>SEA STATE</span><output id="sea-state-value">1.00 M</output></span><input id="sea-state" type="range" min="0.45" max="1.8" step="0.01" value="1" aria-label="海况" /></label>
        <label class="control"><span class="control-label"><span>TIME OF DAY</span><output id="time-of-day-value">17:21</output></span><input id="time-of-day" type="range" min="0" max="24" step="0.05" value="17.35" aria-label="时间" /></label>
        <label class="control"><span class="control-label"><span>DRIFT SPEED</span><output id="drift-speed-value">0.52 KT</output></span><input id="drift-speed" type="range" min="0" max="1.4" step="0.01" value="0.52" aria-label="漂流速度" /></label>
        <label class="control"><span class="control-label"><span>FRAME CAP</span><output id="frame-cap-value">60 FPS</output></span><input id="frame-cap" type="range" min="30" max="60" step="1" value="60" aria-label="帧率上限" /></label>
        <label class="switch"><span id="lock-label">第一人称固定</span><input id="lock-view" type="checkbox" checked aria-label="锁定第一人称视角" /></label>
      </section>
      <div class="metrics"><span id="fps-value">-- FPS</span><span id="bloom-value">TSL BLOOM · DPR --</span></div>
    </main>
    <section id="loading" aria-live="polite"><div class="loading-card"><div class="compass" aria-hidden="true"></div><div class="eyebrow">North Atlantic / Procedural</div><h1>准备进入潮线</h1><p id="loading-detail">正在检测图形能力…</p><div class="loading-line" aria-hidden="true"></div></div></section>
    <section id="error-panel" hidden><div class="error-card"><div class="eyebrow">Rendering unavailable</div><h1>无法展开海面</h1><p id="error-detail">请检查浏览器的硬件图形加速设置后重新加载。</p></div></section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
